version: "3.9"
# Scratch Postgres instance for running the test suite in isolation from
# the dev/demo database. Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler_test
    ports:
      - "5433:5432"
 